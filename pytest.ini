# ==============================================================================
# Personal Expense Tracker with Data Visualization — Pytest Configuration
# ==============================================================================

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers -ra
markers =
    unit: Isolated unit tests verifying specific functions and mathematical logic
    integration: End-to-end integration tests verifying cross-module pipelines
    slow: Tests requiring extended computational, plotting, or file I/O time
